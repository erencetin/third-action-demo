name: Deploy project
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install nodejs
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Deploy to production
        run: echo "Deploying to production server..."